<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galleria delle Idee · EdilCost · Progetto Unico</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&family=Poppins:wght@300;400;500;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style id="dynamicStyles">
        /* Default styles - will be overridden by CMS */
        :root {
            --primary-color: #c17b4c;
            --secondary-color: #667eea;
            --bg-color: #f5f0e8;
            --text-color: #2c2418;
            --heading-font: 'Playfair Display', serif;
            --body-font: 'Inter', sans-serif;
            --border-radius: 50px;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: var(--body-font); 
            background: var(--bg-color); 
            color: var(--text-color);
            line-height: 1.6;
        }
        h1, h2, h3, h4, h5, h6 { font-family: var(--heading-font); }
        
        .container { max-width: 1200px; margin: 0 auto; padding: 0 2rem; }
        
        /* Hero Section */
        .hero {
            min-height: 90vh;
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            position: relative;
        }
        .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(0,0,0,0.5) 0%, rgba(0,0,0,0.3) 100%);
        }
        .hero-content {
            position: relative;
            z-index: 2;
            color: white;
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
        }
        .hero-badge {
            display: inline-block;
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);
            padding: 0.5rem 1.5rem;
            border-radius: 50px;
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }
        .hero-content h1 {
            font-size: 4rem;
            margin-bottom: 1.5rem;
            line-height: 1.2;
        }
        .hero-content p {
            font-size: 1.2rem;
            margin-bottom: 2rem;
            opacity: 0.95;
        }
        .btn-primary {
            display: inline-block;
            background: var(--primary-color);
            color: white;
            padding: 1rem 2.5rem;
            border-radius: var(--border-radius);
            text-decoration: none;
            font-weight: 600;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        
        /* Section Styles */
        .section {
            padding: 5rem 0;
        }
        .section-title {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 3rem;
            color: var(--primary-color);
        }
        
        /* About Section */
        .about-content {
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
            font-size: 1.1rem;
        }
        .company-logos {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-top: 3rem;
            flex-wrap: wrap;
        }
        .company-logos span {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--primary-color);
        }
        
        /* Services Grid */
        .services-grid, .projects-grid, .brands-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            margin-top: 2rem;
        }
        .service-card, .project-card, .brand-card {
            background: white;
            padding: 2rem;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }
        .service-card:hover, .project-card:hover, .brand-card:hover {
            transform: translateY(-5px);
        }
        .service-card i, .brand-card i {
            font-size: 3rem;
            color: var(--primary-color);
            margin-bottom: 1rem;
        }
        .project-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 1rem;
        }
        
        /* Contact Section */
        .contact-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3rem;
        }
        .contact-info {
            background: white;
            padding: 2rem;
            border-radius: 15px;
        }
        .contact-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .contact-item i {
            width: 40px;
            height: 40px;
            background: var(--primary-color);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .social-links {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
        }
        .social-links a {
            width: 40px;
            height: 40px;
            background: var(--primary-color);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s;
        }
        .social-links a:hover {
            transform: translateY(-3px);
        }
        
        /* Footer */
        footer {
            background: var(--text-color);
            color: white;
            padding: 3rem 0 1rem;
            margin-top: 3rem;
        }
        .footer-content {
            text-align: center;
        }
        .footer-tagline {
            font-size: 1.2rem;
            margin-bottom: 1rem;
            font-style: italic;
        }
        .copyright {
            margin-top: 2rem;
            opacity: 0.8;
            font-size: 0.9rem;
        }
        
        @media (max-width: 768px) {
            .hero-content h1 { font-size: 2rem; }
            .contact-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<!-- Hero Section -->
<section class="hero" id="heroSection">
    <div class="container">
        <div class="hero-content">
            <div class="hero-badge" id="heroBadge">Loading...</div>
            <h1 id="heroTitle">Loading...</h1>
            <p id="heroSubtitle">Loading...</p>
            <a href="#" class="btn-primary" id="heroBtn">Loading...</a>
        </div>
    </div>
</section>

<!-- About Section -->
<section class="section" id="aboutSection">
    <div class="container">
        <h2 class="section-title" id="aboutTitle">Loading...</h2>
        <div class="about-content">
            <div id="aboutText">Loading...</div>
            <div class="company-logos" id="companyLogos"></div>
        </div>
    </div>
</section>

<!-- Services Section -->
<section class="section" id="servicesSection">
    <div class="container">
        <h2 class="section-title" id="servicesTitle">Loading...</h2>
        <div class="services-grid" id="servicesGrid"></div>
    </div>
</section>

<!-- Projects Section -->
<section class="section" id="projectsSection">
    <div class="container">
        <h2 class="section-title" id="projectsTitle">Loading...</h2>
        <div class="projects-grid" id="projectsGrid"></div>
    </div>
</section>

<!-- Brands Section -->
<section class="section" id="brandsSection">
    <div class="container">
        <h2 class="section-title" id="brandsTitle">Loading...</h2>
        <div class="brands-grid" id="brandsGrid"></div>
    </div>
</section>

<!-- Contact Section -->
<section class="section" id="contactSection">
    <div class="container">
        <h2 class="section-title" id="contactTitle">Loading...</h2>
        <div class="contact-grid">
            <div class="contact-info">
                <div class="contact-item">
                    <i class="fas fa-map-marker-alt"></i>
                    <span id="contactAddress">Loading...</span>
                </div>
                <div class="contact-item">
                    <i class="fas fa-phone"></i>
                    <span id="contactPhone">Loading...</span>
                </div>
                <div class="contact-item">
                    <i class="fas fa-envelope"></i>
                    <span id="contactEmail">Loading...</span>
                </div>
                <div class="contact-item">
                    <i class="fas fa-globe"></i>
                    <span id="contactWebsite">Loading...</span>
                </div>
                <div class="social-links" id="socialLinks"></div>
            </div>
            <div class="contact-map" id="contactMap"></div>
        </div>
    </div>
</section>

<!-- Footer -->
<footer>
    <div class="container">
        <div class="footer-content">
            <div class="footer-tagline" id="footerTagline">Loading...</div>
            <p id="footerText">Loading...</p>
            <div class="copyright" id="copyrightText">Loading...</div>
        </div>
    </div>
</footer>

<script>
    // Load data from localStorage
    let websiteData = null;
    
    function loadWebsiteData() {
        const saved = localStorage.getItem('progettoCMSData');
        if(saved) {
            websiteData = JSON.parse(saved);
            applyDesignSettings();
            renderWebsite();
        } else {
            // Load default data if no saved data exists
            fetchDefaultData();
        }
    }
    
    function fetchDefaultData() {
        // Default data structure (same as admin panel defaults)
        websiteData = {
            hero: {
                badge: "Progetto Unico Group · Ideal Casa Srl",
                title: "Galleria delle Idee<br>EdilCost",
                subtitle: "La tua nuova idea di Casa · Progettazione · Interior Design · Realizzazione",
                btnText: "Richiedi Consulenza",
                bgImage: "https://images.unsplash.com/photo-1600607687644-c7171b42498b?w=1600"
            },
            about: {
                title: "Chi Siamo",
                text: "<strong>Progetto Unico</strong> è il gruppo che riunisce <strong>EdilCost</strong> e <strong>Ideal Casa Srl</strong>, quest'ultima proprietaria del brand <strong>Galleria delle Idee</strong>. Lo showroom è stato pensato per accogliere le necessità di chiunque varchi la porta d'ingresso. <strong>Qualunque sia la sua idea di casa.</strong><br><br><em>Fabio & Paolo Buongiorno</em>",
                companyNames: ["PROGETTO UNICO GROUP", "EDILCOST", "IDEAL CASA SRL", "GALLERIA DELLE IDEE"]
            },
            services: {
                title: "I Nostri Servizi",
                items: [
                    { icon: "fas fa-pen-ruler", title: "Consulenza", desc: "Oltre 30 anni di esperienza a tua disposizione" },
                    { icon: "fas fa-palette", title: "Interior Design", desc: "Trasformiamo gli spazi con linee funzionali" },
                    { icon: "fas fa-tile", title: "Pavimenti e Rivestimenti", desc: "Ceramiche dai migliori brand italiani" },
                    { icon: "fas fa-toilet", title: "Arredo Bagno", desc: "Soluzioni eleganti e personalizzate" },
                    { icon: "fas fa-faucet", title: "Rubinetteria", desc: "Design e qualità per la tua casa" },
                    { icon: "fas fa-spa", title: "Wellness e Spa", desc: "Crea il tuo angolo di benessere" }
                ]
            },
            projects: {
                title: "I Nostri Progetti",
                items: [
                    { title: "Villa Mediterranea", desc: "Completa ristrutturazione con piscina e area wellness", image: "https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=400" },
                    { title: "Showroom Gallery", desc: "Nuovo spazio espositivo di 300mq", image: "https://images.unsplash.com/photo-1600607687644-c7171b42498b?w=400" }
                ]
            },
            brands: {
                title: "I Nostri Brand",
                items: [
                    { icon: "fas fa-gem", title: "Ceramiche Italiane", desc: "Il meglio del made in Italy" },
                    { icon: "fas fa-globe-europe", title: "Brand Internazionali", desc: "Selezione esclusiva di produttori globali" },
                    { icon: "fas fa-bath", title: "Wellness Luxury", desc: "Eccellenza per Spa e benessere" }
                ]
            },
            contact: {
                title: "Contattaci",
                address: "Via Francesco Rodio, 4 – 72017 - Ostuni (BR)",
                phone: "+39.0831 341520",
                email: "info@galleriadelleidee.com",
                website: "www.galleriadelleideeostuni.com",
                map: "",
                social: {
                    facebook: "https://www.facebook.com/galleriadelleideeostuni",
                    instagram: "https://www.instagram.com/galleriadelleidee/",
                    linkedin: ""
                }
            },
            footer: {
                text: "Progetto Unico Group · Ideal Casa Srl · EdilCost · Galleria delle Idee",
                copyright: "© 2025 Tutti i diritti riservati",
                tagline: "Qualunque sia la tua idea di casa, noi la realizziamo."
            },
            design: {
                primaryColor: "#c17b4c",
                secondaryColor: "#667eea",
                bgColor: "#f5f0e8",
                textColor: "#2c2418",
                headingFont: "'Playfair Display', serif",
                bodyFont: "'Inter', sans-serif",
                borderRadius: "50"
            }
        };
        renderWebsite();
    }
    
    function applyDesignSettings() {
        const root = document.documentElement;
        root.style.setProperty('--primary-color', websiteData.design.primaryColor);
        root.style.setProperty('--secondary-color', websiteData.design.secondaryColor);
        root.style.setProperty('--bg-color', websiteData.design.bgColor);
        root.style.setProperty('--text-color', websiteData.design.textColor);
        root.style.setProperty('--heading-font', websiteData.design.headingFont);
        root.style.setProperty('--body-font', websiteData.design.bodyFont);
        root.style.setProperty('--border-radius', websiteData.design.borderRadius + 'px');
    }
    
    function renderWebsite() {
        // Hero Section
        document.getElementById('heroBadge').innerHTML = websiteData.hero.badge;
        document.getElementById('heroTitle').innerHTML = websiteData.hero.title;
        document.getElementById('heroSubtitle').innerHTML = websiteData.hero.subtitle;
        document.getElementById('heroBtn').innerHTML = websiteData.hero.btnText;
        document.querySelector('.hero').style.backgroundImage = `url(${websiteData.hero.bgImage})`;
        
        // About Section
        document.getElementById('aboutTitle').innerHTML = websiteData.about.title;
        document.getElementById('aboutText').innerHTML = websiteData.about.text;
        
        const companyLogos = document.getElementById('companyLogos');
        companyLogos.innerHTML = websiteData.about.companyNames.map(name => `<span>${name}</span>`).join('');
        
        // Services Section
        document.getElementById('servicesTitle').innerHTML = websiteData.services.title;
        const servicesGrid = document.getElementById('servicesGrid');
        servicesGrid.innerHTML = websiteData.services.items.map(service => `
            <div class="service-card">
                <i class="${service.icon}"></i>
                <h3>${service.title}</h3>
                <p>${service.desc}</p>
            </div>
        `).join('');
        
        // Projects Section
        document.getElementById('projectsTitle').innerHTML = websiteData.projects.title;
        const projectsGrid = document.getElementById('projectsGrid');
        projectsGrid.innerHTML = websiteData.projects.items.map(project => `
            <div class="project-card">
                <img src="${project.image}" alt="${project.title}">
                <h3>${project.title}</h3>
                <p>${project.desc}</p>
            </div>
        `).join('');
        
        // Brands Section
        document.getElementById('brandsTitle').innerHTML = websiteData.brands.title;
        const brandsGrid = document.getElementById('brandsGrid');
        brandsGrid.innerHTML = websiteData.brands.items.map(brand => `
            <div class="brand-card">
                <i class="${brand.icon}"></i>
                <h3>${brand.title}</h3>
                <p>${brand.desc}</p>
            </div>
        `).join('');
        
        // Contact Section
        document.getElementById('contactTitle').innerHTML = websiteData.contact.title;
        document.getElementById('contactAddress').innerHTML = websiteData.contact.address;
        document.getElementById('contactPhone').innerHTML = websiteData.contact.phone;
        document.getElementById('contactEmail').innerHTML = websiteData.contact.email;
        document.getElementById('contactWebsite').innerHTML = websiteData.contact.website;
        
        const socialLinks = document.getElementById('socialLinks');
        let socialHtml = '';
        if(websiteData.contact.social.facebook) socialHtml += `<a href="${websiteData.contact.social.facebook}" target="_blank"><i class="fab fa-facebook-f"></i></a>`;
        if(websiteData.contact.social.instagram) socialHtml += `<a href="${websiteData.contact.social.instagram}" target="_blank"><i class="fab fa-instagram"></i></a>`;
        if(websiteData.contact.social.linkedin) socialHtml += `<a href="${websiteData.contact.social.linkedin}" target="_blank"><i class="fab fa-linkedin-in"></i></a>`;
        socialLinks.innerHTML = socialHtml;
        
        const contactMap = document.getElementById('contactMap');
        if(websiteData.contact.map) {
            contactMap.innerHTML = `<iframe src="${websiteData.contact.map}" width="100%" height="300" style="border:0; border-radius:15px;" allowfullscreen></iframe>`;
        } else {
            contactMap.innerHTML = '';
        }
        
        // Footer
        document.getElementById('footerTagline').innerHTML = websiteData.footer.tagline;
        document.getElementById('footerText').innerHTML = websiteData.footer.text;
        document.getElementById('copyrightText').innerHTML = websiteData.footer.copyright;
    }
    
    // Auto-refresh when localStorage changes (for real-time updates)
    window.addEventListener('storage', function(e) {
        if(e.key === 'progettoCMSData') {
            loadWebsiteData();
        }
    });
    
    // Load data on page load
    loadWebsiteData();
</script>
</body>
</html>
