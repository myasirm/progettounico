<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progetto Unico · CMS Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #0f0f1a; color: #fff; }
        
        /* Login */
        .login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
        }
        .login-card {
            background: white;
            padding: 2.5rem;
            border-radius: 20px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            color: #333;
        }
        .login-card i { font-size: 3rem; color: #667eea; margin-bottom: 1rem; }
        .login-card h2 { margin-bottom: 1.5rem; }
        .login-card input {
            width: 100%;
            padding: 1rem;
            margin: 0.5rem 0;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
        }
        .login-card button {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 1rem;
        }
        .login-card button:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(102,126,234,0.4); }
        
        /* Admin Dashboard */
        .admin-container { display: none; }
        .admin-sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 280px;
            height: 100vh;
            background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%);
            overflow-y: auto;
            box-shadow: 2px 0 20px rgba(0,0,0,0.3);
        }
        .admin-logo {
            padding: 1.5rem;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .admin-logo h2 { background: linear-gradient(135deg, #667eea, #764ba2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .admin-menu { padding: 1rem 0; }
        .menu-item {
            padding: 1rem 1.5rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            cursor: pointer;
            transition: 0.3s;
            color: #aaa;
        }
        .menu-item:hover, .menu-item.active {
            background: linear-gradient(90deg, #667eea, #764ba2);
            color: white;
        }
        .menu-item i { width: 25px; }
        
        .admin-content {
            margin-left: 280px;
            padding: 2rem;
        }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .view-site-btn, .logout-btn {
            padding: 0.5rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            border: none;
            font-weight: 600;
            transition: 0.3s;
        }
        .view-site-btn { background: #2c3e50; color: white; text-decoration: none; margin-right: 1rem; display: inline-block; }
        .view-site-btn:hover { background: #34495e; transform: translateY(-2px); }
        .logout-btn { background: #e94560; color: white; }
        .logout-btn:hover { background: #c0392b; transform: translateY(-2px); }
        .publish-btn { background: #27ae60; color: white; border: none; padding: 0.5rem 1.5rem; border-radius: 8px; cursor: pointer; font-weight: 600; margin-right: 1rem; transition: 0.3s; }
        .publish-btn:hover { background: #229954; transform: translateY(-2px); }
        
        .section-editor {
            background: rgba(26, 26, 46, 0.95);
            border-radius: 15px;
            padding: 2rem;
            margin-bottom: 2rem;
            backdrop-filter: blur(10px);
        }
        .section-title {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #aaa;
        }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            background: #0f3460;
            color: white;
            font-family: inherit;
        }
        .form-group textarea { min-height: 100px; }
        
        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }
        .item-card {
            background: #0f3460;
            border-radius: 10px;
            padding: 1rem;
        }
        .item-card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 0.5rem;
        }
        .btn-primary { background: linear-gradient(135deg, #667eea, #764ba2); color: white; border: none; padding: 0.5rem 1rem; border-radius: 5px; cursor: pointer; transition: 0.3s; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(102,126,234,0.4); }
        .btn-danger { background: #e94560; color: white; border: none; padding: 0.5rem 1rem; border-radius: 5px; cursor: pointer; transition: 0.3s; }
        .btn-danger:hover { background: #c0392b; transform: translateY(-2px); }
        .btn-secondary { background: #2c3e50; color: white; border: none; padding: 0.5rem 1rem; border-radius: 5px; cursor: pointer; transition: 0.3s; }
        .btn-secondary:hover { background: #34495e; transform: translateY(-2px); }
        
        .toast-msg {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #27ae60;
            padding: 1rem 2rem;
            border-radius: 10px;
            z-index: 2000;
            display: none;
            animation: slideIn 0.3s ease;
        }
        
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        @media (max-width: 768px) {
            .admin-sidebar { width: 70px; }
            .admin-sidebar span { display: none; }
            .admin-content { margin-left: 70px; }
            .menu-item { justify-content: center; }
            .menu-item i { margin: 0; }
        }
    </style>
</head>
<body>

<div id="loginOverlay" class="login-overlay">
    <div class="login-card">
        <i class="fas fa-crown"></i>
        <h2>CMS Admin Panel</h2>
        <input type="text" id="adminUser" placeholder="Username" value="admin">
        <input type="password" id="adminPass" placeholder="Password" value="admin123">
        <button onclick="attemptLogin()">Login to Dashboard</button>
        <div id="loginError" style="color: red; margin-top: 1rem;"></div>
    </div>
</div>

<div id="adminContainer" class="admin-container">
    <div class="admin-sidebar">
        <div class="admin-logo">
            <h2><i class="fas fa-crown"></i> <span>Progetto CMS</span></h2>
        </div>
        <div class="admin-menu">
            <div class="menu-item active" data-section="hero"><i class="fas fa-home"></i> <span>Hero Section</span></div>
            <div class="menu-item" data-section="about"><i class="fas fa-info-circle"></i> <span>Chi Siamo</span></div>
            <div class="menu-item" data-section="services"><i class="fas fa-concierge-bell"></i> <span>Servizi</span></div>
            <div class="menu-item" data-section="projects"><i class="fas fa-hard-hat"></i> <span>Progetti</span></div>
            <div class="menu-item" data-section="brands"><i class="fas fa-trademark"></i> <span>Brand</span></div>
            <div class="menu-item" data-section="contact"><i class="fas fa-address-card"></i> <span>Contatti</span></div>
            <div class="menu-item" data-section="footer"><i class="fas fa-copyright"></i> <span>Footer</span></div>
            <div class="menu-item" data-section="design"><i class="fas fa-palette"></i> <span>Design & Style</span></div>
            <div class="menu-item" data-section="backup"><i class="fas fa-database"></i> <span>Backup</span></div>
        </div>
    </div>
    
    <div class="admin-content">
        <div class="admin-header">
            <h1 id="currentSection">Hero Section</h1>
            <div>
                <button class="publish-btn" onclick="publishToWebsite()"><i class="fas fa-globe"></i> Publish</button>
                <a href="index.html" target="_blank" class="view-site-btn"><i class="fas fa-external-link-alt"></i> View Site</a>
                <button class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </div>
        </div>
        
        <!-- HERO SECTION -->
        <div id="heroSection" class="section-editor">
            <h2 class="section-title">Hero Section</h2>
            <div class="form-group">
                <label>Hero Badge Text</label>
                <input type="text" id="heroBadge">
            </div>
            <div class="form-group">
                <label>Hero Title</label>
                <input type="text" id="heroTitle">
            </div>
            <div class="form-group">
                <label>Hero Subtitle</label>
                <input type="text" id="heroSubtitle">
            </div>
            <div class="form-group">
                <label>Hero Button Text</label>
                <input type="text" id="heroBtnText">
            </div>
            <div class="form-group">
                <label>Background Image URL</label>
                <input type="text" id="heroBgImage">
            </div>
            <button class="btn-primary" onclick="saveHero()">Save Hero Section</button>
        </div>
        
        <!-- ABOUT SECTION -->
        <div id="aboutSection" class="section-editor" style="display:none;">
            <h2 class="section-title">Chi Siamo</h2>
            <div class="form-group">
                <label>Section Title</label>
                <input type="text" id="aboutTitle">
            </div>
            <div class="form-group">
                <label>About Text</label>
                <textarea id="aboutText" rows="6"></textarea>
            </div>
            <div class="form-group">
                <label>Company Names (comma separated)</label>
                <input type="text" id="companyNames">
            </div>
            <button class="btn-primary" onclick="saveAbout()">Save About Section</button>
        </div>
        
        <!-- SERVICES SECTION -->
        <div id="servicesSection" class="section-editor" style="display:none;">
            <h2 class="section-title">Servizi</h2>
            <div class="form-group">
                <label>Section Title</label>
                <input type="text" id="servicesTitle">
            </div>
            <div id="servicesList"></div>
            <button class="btn-secondary" onclick="addService()">+ Add New Service</button>
            <button class="btn-primary" onclick="saveServices()" style="margin-top: 1rem;">Save All Services</button>
        </div>
        
        <!-- PROJECTS SECTION -->
        <div id="projectsSection" class="section-editor" style="display:none;">
            <h2 class="section-title">Progetti</h2>
            <div class="form-group">
                <label>Section Title</label>
                <input type="text" id="projectsTitle">
            </div>
            <div id="projectsList"></div>
            <button class="btn-secondary" onclick="addProject()">+ Add New Project</button>
            <button class="btn-primary" onclick="saveProjects()" style="margin-top: 1rem;">Save All Projects</button>
        </div>
        
        <!-- BRANDS SECTION -->
        <div id="brandsSection" class="section-editor" style="display:none;">
            <h2 class="section-title">Brand</h2>
            <div class="form-group">
                <label>Section Title</label>
                <input type="text" id="brandsTitle">
            </div>
            <div id="brandsList"></div>
            <button class="btn-secondary" onclick="addBrand()">+ Add New Brand</button>
            <button class="btn-primary" onclick="saveBrands()" style="margin-top: 1rem;">Save All Brands</button>
        </div>
        
        <!-- CONTACT SECTION -->
        <div id="contactSection" class="section-editor" style="display:none;">
            <h2 class="section-title">Contatti</h2>
            <div class="form-group">
                <label>Section Title</label>
                <input type="text" id="contactTitle">
            </div>
            <div class="form-group">
                <label>Address</label>
                <input type="text" id="contactAddress">
            </div>
            <div class="form-group">
                <label>Phone</label>
                <input type="text" id="contactPhone">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="contactEmail">
            </div>
            <div class="form-group">
                <label>Website</label>
                <input type="text" id="contactWebsite">
            </div>
            <div class="form-group">
                <label>Facebook URL</label>
                <input type="text" id="socialFacebook">
            </div>
            <div class="form-group">
                <label>Instagram URL</label>
                <input type="text" id="socialInstagram">
            </div>
            <div class="form-group">
                <label>LinkedIn URL</label>
                <input type="text" id="socialLinkedin">
            </div>
            <button class="btn-primary" onclick="saveContact()">Save Contact Section</button>
        </div>
        
        <!-- FOOTER SECTION -->
        <div id="footerSection" class="section-editor" style="display:none;">
            <h2 class="section-title">Footer</h2>
            <div class="form-group">
                <label>Footer Text</label>
                <textarea id="footerText" rows="3"></textarea>
            </div>
            <div class="form-group">
                <label>Copyright Text</label>
                <input type="text" id="copyrightText">
            </div>
            <div class="form-group">
                <label>Tagline</label>
                <input type="text" id="footerTagline">
            </div>
            <button class="btn-primary" onclick="saveFooter()">Save Footer</button>
        </div>
        
        <!-- DESIGN SECTION -->
        <div id="designSection" class="section-editor" style="display:none;">
            <h2 class="section-title">Design & Style</h2>
            <div class="form-group">
                <label>Primary Color</label>
                <input type="color" id="primaryColor">
            </div>
            <div class="form-group">
                <label>Secondary Color</label>
                <input type="color" id="secondaryColor">
            </div>
            <div class="form-group">
                <label>Background Color</label>
                <input type="color" id="bgColor">
            </div>
            <div class="form-group">
                <label>Accent Color</label>
                <input type="color" id="accentColor">
            </div>
            <button class="btn-primary" onclick="saveDesign()">Save Design Settings</button>
        </div>
        
        <!-- BACKUP SECTION -->
        <div id="backupSection" class="section-editor" style="display:none;">
            <h2 class="section-title">Backup & Restore</h2>
            <div class="form-group">
                <label>Export Website Data</label>
                <button class="btn-primary" onclick="exportData()">📥 Download Backup</button>
            </div>
            <div class="form-group">
                <label>Import Backup File</label>
                <input type="file" id="importFile" accept=".json">
                <button class="btn-secondary" onclick="importData()">📤 Restore from Backup</button>
            </div>
            <div class="form-group">
                <label style="color: #e94560;">Danger Zone</label>
                <button class="btn-danger" onclick="resetAll()">⚠️ Reset Everything to Default</button>
            </div>
        </div>
    </div>
</div>

<div id="toastMsg" class="toast-msg"></div>

<script>
    let websiteData = {
        hero: { badge: "✨ Progetto Unico Group", title: "Galleria delle Idee", subtitle: "La tua nuova idea di casa", btnText: "Richiedi Consulenza", bgImage: "https://images.unsplash.com/photo-1600607687644-c7171b42498b?w=1600" },
        about: { title: "Chi Siamo", text: "Il gruppo che riunisce le migliori realtà nel settore dell'edilizia e del design.", companyNames: ["PROGETTO UNICO", "EDILCOST", "IDEAL CASA"] },
        services: { title: "I Nostri Servizi", items: [
            { icon: "fas fa-pen-ruler", title: "Consulenza", desc: "Oltre 30 anni di esperienza" },
            { icon: "fas fa-palette", title: "Interior Design", desc: "Trasformiamo gli spazi" }
        ]},
        projects: { title: "I Nostri Progetti", items: [
            { title: "Villa Mediterranea", desc: "Completa ristrutturazione", image: "https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=400" }
        ]},
        brands: { title: "I Nostri Brand", items: [
            { icon: "fas fa-gem", title: "Ceramiche Italiane", desc: "Made in Italy" }
        ]},
        contact: { title: "Contattaci", address: "Via Roma, 1 - Milano", phone: "+39 123 456 789", email: "info@example.com", website: "www.example.com", social: { facebook: "", instagram: "", linkedin: "" } },
        footer: { text: "Progetto Unico Group", copyright: "© 2025 Tutti i diritti riservati", tagline: "Qualunque sia la tua idea di casa" },
        design: { primaryColor: "#ff6b6b", secondaryColor: "#4ecdc4", bgColor: "#ffffff", accentColor: "#ffe66d" }
    };
    
    function showToast(msg) {
        const toast = document.getElementById('toastMsg');
        toast.textContent = msg;
        toast.style.display = 'block';
        setTimeout(() => toast.style.display = 'none', 2000);
    }
    
    function loadData() {
        const saved = localStorage.getItem('progettoCMSData_V2');
        if(saved) {
            websiteData = JSON.parse(saved);
            showToast("Data loaded successfully!");
        }
        populateFields();
        renderServicesList();
        renderProjectsList();
        renderBrandsList();
    }
    
    function saveData() {
        localStorage.setItem('progettoCMSData_V2', JSON.stringify(websiteData));
        showToast("Changes saved to admin panel!");
    }
    
    function publishToWebsite() {
        saveHero(); saveAbout(); saveServices(); saveProjects(); saveBrands(); saveContact(); saveFooter(); saveDesign();
        localStorage.setItem('progettoCMSData_V2', JSON.stringify(websiteData));
        showToast("✅ Published! Your website now shows the latest changes.");
        setTimeout(() => window.open('index.html', '_blank'), 500);
    }
    
    function populateFields() {
        document.getElementById('heroBadge').value = websiteData.hero.badge;
        document.getElementById('heroTitle').value = websiteData.hero.title;
        document.getElementById('heroSubtitle').value = websiteData.hero.subtitle;
        document.getElementById('heroBtnText').value = websiteData.hero.btnText;
        document.getElementById('heroBgImage').value = websiteData.hero.bgImage;
        document.getElementById('aboutTitle').value = websiteData.about.title;
        document.getElementById('aboutText').value = websiteData.about.text;
        document.getElementById('companyNames').value = websiteData.about.companyNames.join(', ');
        document.getElementById('servicesTitle').value = websiteData.services.title;
        document.getElementById('projectsTitle').value = websiteData.projects.title;
        document.getElementById('brandsTitle').value = websiteData.brands.title;
        document.getElementById('contactTitle').value = websiteData.contact.title;
        document.getElementById('contactAddress').value = websiteData.contact.address;
        document.getElementById('contactPhone').value = websiteData.contact.phone;
        document.getElementById('contactEmail').value = websiteData.contact.email;
        document.getElementById('contactWebsite').value = websiteData.contact.website;
        document.getElementById('socialFacebook').value = websiteData.contact.social.facebook;
        document.getElementById('socialInstagram').value = websiteData.contact.social.instagram;
        document.getElementById('socialLinkedin').value = websiteData.contact.social.linkedin;
        document.getElementById('footerText').value = websiteData.footer.text;
        document.getElementById('copyrightText').value = websiteData.footer.copyright;
        document.getElementById('footerTagline').value = websiteData.footer.tagline;
        document.getElementById('primaryColor').value = websiteData.design.primaryColor;
        document.getElementById('secondaryColor').value = websiteData.design.secondaryColor;
        document.getElementById('bgColor').value = websiteData.design.bgColor;
        document.getElementById('accentColor').value = websiteData.design.accentColor;
    }
    
    function saveHero() {
        websiteData.hero.badge = document.getElementById('heroBadge').value;
        websiteData.hero.title = document.getElementById('heroTitle').value;
        websiteData.hero.subtitle = document.getElementById('heroSubtitle').value;
        websiteData.hero.btnText = document.getElementById('heroBtnText').value;
        websiteData.hero.bgImage = document.getElementById('heroBgImage').value;
        saveData();
    }
    
    function saveAbout() {
        websiteData.about.title = document.getElementById('aboutTitle').value;
        websiteData.about.text = document.getElementById('aboutText').value;
        websiteData.about.companyNames = document.getElementById('companyNames').value.split(',').map(s => s.trim());
        saveData();
    }
    
    function saveContact() {
        websiteData.contact.title = document.getElementById('contactTitle').value;
        websiteData.contact.address = document.getElementById('contactAddress').value;
        websiteData.contact.phone = document.getElementById('contactPhone').value;
        websiteData.contact.email = document.getElementById('contactEmail').value;
        websiteData.contact.website = document.getElementById('contactWebsite').value;
        websiteData.contact.social.facebook = document.getElementById('socialFacebook').value;
        websiteData.contact.social.instagram = document.getElementById('socialInstagram').value;
        websiteData.contact.social.linkedin = document.getElementById('socialLinkedin').value;
        saveData();
    }
    
    function saveFooter() {
        websiteData.footer.text = document.getElementById('footerText').value;
        websiteData.footer.copyright = document.getElementById('copyrightText').value;
        websiteData.footer.tagline = document.getElementById('footerTagline').value;
        saveData();
    }
    
    function saveDesign() {
        websiteData.design.primaryColor = document.getElementById('primaryColor').value;
        websiteData.design.secondaryColor = document.getElementById('secondaryColor').value;
        websiteData.design.bgColor = document.getElementById('bgColor').value;
        websiteData.design.accentColor = document.getElementById('accentColor').value;
        saveData();
    }
    
    function renderServicesList() {
        const container = document.getElementById('servicesList');
        if(!container) return;
        container.innerHTML = '<div class="items-grid" id="servicesGrid"></div>';
        const grid = document.getElementById('servicesGrid');
        websiteData.services.items.forEach((item, idx) => {
            grid.innerHTML += `
                <div class="item-card">
                    <i class="${item.icon}" style="font-size: 2rem;"></i>
                    <input type="text" id="service_title_${idx}" value="${item.title.replace(/"/g, '&quot;')}" style="width:100%; margin-top:10px;">
                    <textarea id="service_desc_${idx}" style="width:100%; margin-top:10px;">${item.desc}</textarea>
                    <button class="btn-danger" onclick="deleteService(${idx})" style="margin-top:10px;">Delete</button>
                </div>
            `;
        });
    }
    
    function saveServices() {
        const newItems = [];
        for(let i = 0; i < websiteData.services.items.length; i++) {
            const title = document.getElementById(`service_title_${i}`)?.value;
            const desc = document.getElementById(`service_desc_${i}`)?.value;
            if(title) newItems.push({ icon: "fas fa-star", title, desc });
        }
        websiteData.services.items = newItems;
        websiteData.services.title = document.getElementById('servicesTitle').value;
        saveData();
        renderServicesList();
        showToast("Services saved!");
    }
    
    function addService() {
        websiteData.services.items.push({ icon: "fas fa-star", title: "New Service", desc: "Description" });
        renderServicesList();
    }
    
    function deleteService(index) {
        websiteData.services.items.splice(index, 1);
        renderServicesList();
    }
    
    function renderProjectsList() {
        const container = document.getElementById('projectsList');
        if(!container) return;
        container.innerHTML = '<div class="items-grid" id="projectsGrid"></div>';
        const grid = document.getElementById('projectsGrid');
        websiteData.projects.items.forEach((item, idx) => {
            grid.innerHTML += `
                <div class="item-card">
                    <img src="${item.image}" onerror="this.src='https://via.placeholder.com/300x200'">
                    <input type="text" id="project_title_${idx}" value="${item.title.replace(/"/g, '&quot;')}" style="width:100%; margin-top:10px;">
                    <textarea id="project_desc_${idx}" style="width:100%; margin-top:10px;">${item.desc}</textarea>
                    <input type="text" id="project_image_${idx}" value="${item.image}" style="width:100%; margin-top:10px;">
                    <button class="btn-danger" onclick="deleteProject(${idx})" style="margin-top:10px;">Delete</button>
                </div>
            `;
        });
    }
    
    function saveProjects() {
        const newItems = [];
        for(let i = 0; i < websiteData.projects.items.length; i++) {
            const title = document.getElementById(`project_title_${i}`)?.value;
            const desc = document.getElementById(`project_desc_${i}`)?.value;
            const image = document.getElementById(`project_image_${i}`)?.value;
            if(title) newItems.push({ title, desc, image });
        }
        websiteData.projects.items = newItems;
        websiteData.projects.title = document.getElementById('projectsTitle').value;
        saveData();
        renderProjectsList();
        showToast("Projects saved!");
    }
    
    function addProject() {
        websiteData.projects.items.push({ title: "New Project", desc: "Description", image: "" });
        renderProjectsList();
    }
    
    function deleteProject(index) {
        websiteData.projects.items.splice(index, 1);
        renderProjectsList();
    }
    
    function renderBrandsList() {
        const container = document.getElementById('brandsList');
        if(!container) return;
        container.innerHTML = '<div class="items-grid" id="brandsGrid"></div>';
        const grid = document.getElementById('brandsGrid');
        websiteData.brands.items.forEach((item, idx) => {
            grid.innerHTML += `
                <div class="item-card">
                    <i class="${item.icon}" style="font-size: 2rem;"></i>
                    <input type="text" id="brand_title_${idx}" value="${item.title.replace(/"/g, '&quot;')}" style="width:100%; margin-top:10px;">
                    <textarea id="brand_desc_${idx}" style="width:100%; margin-top:10px;">${item.desc}</textarea>
                    <button class="btn-danger" onclick="deleteBrand(${idx})" style="margin-top:10px;">Delete</button>
                </div>
            `;
        });
    }
    
    function saveBrands() {
        const newItems = [];
        for(let i = 0; i < websiteData.brands.items.length; i++) {
            const title = document.getElementById(`brand_title_${i}`)?.value;
            const desc = document.getElementById(`brand_desc_${i}`)?.value;
            if(title) newItems.push({ icon: "fas fa-gem", title, desc });
        }
        websiteData.brands.items = newItems;
        websiteData.brands.title = document.getElementById('brandsTitle').value;
        saveData();
        renderBrandsList();
        showToast("Brands saved!");
    }
    
    function addBrand() {
        websiteData.brands.items.push({ icon: "fas fa-gem", title: "New Brand", desc: "Description" });
        renderBrandsList();
    }
    
    function deleteBrand(index) {
        websiteData.brands.items.splice(index, 1);
        renderBrandsList();
    }
    
    function exportData() {
        const dataStr = JSON.stringify(websiteData, null, 2);
        const blob = new Blob([dataStr], {type: 'application/json'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'website_backup.json';
        a.click();
        URL.revokeObjectURL(url);
        showToast("Backup downloaded!");
    }
    
    function importData() {
        const file = document.getElementById('importFile').files[0];
        if(!file) { showToast("Select a backup file first"); return; }
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                websiteData = JSON.parse(e.target.result);
                saveData();
                location.reload();
            } catch(err) { showToast("Invalid backup file!"); }
        };
        reader.readAsText(file);
    }
    
    function resetAll() {
        if(confirm('⚠️ This will reset everything! Are you sure?')) {
            localStorage.removeItem('progettoCMSData_V2');
            location.reload();
        }
    }
    
    document.querySelectorAll('.menu-item').forEach(item => {
        item.addEventListener('click', function() {
            const section = this.dataset.section;
            document.querySelectorAll('.section-editor').forEach(el => el.style.display = 'none');
            document.getElementById(`${section}Section`).style.display = 'block';
            document.querySelectorAll('.menu-item').forEach(el => el.classList.remove('active'));
            this.classList.add('active');
            const titles = { hero:'Hero', about:'Chi Siamo', services:'Servizi', projects:'Progetti', brands:'Brand', contact:'Contatti', footer:'Footer', design:'Design', backup:'Backup' };
            document.getElementById('currentSection').innerHTML = titles[section] + ' Section';
        });
    });
    
    function attemptLogin() {
        const user = document.getElementById('adminUser').value;
        const pass = document.getElementById('adminPass').value;
        if(user === 'admin' && pass === 'admin123') {
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('adminContainer').style.display = 'block';
            loadData();
        } else {
            document.getElementById('loginError').innerText = 'Wrong credentials! Use admin / admin123';
        }
    }
    
    function logout() {
        document.getElementById('loginOverlay').style.display = 'flex';
        document.getElementById('adminContainer').style.display = 'none';
    }
    
    window.attemptLogin = attemptLogin; window.logout = logout; window.saveHero = saveHero;
    window.saveAbout = saveAbout; window.saveServices = saveServices; window.saveProjects = saveProjects;
    window.saveBrands = saveBrands; window.saveContact = saveContact; window.saveFooter = saveFooter;
    window.saveDesign = saveDesign; window.addService = addService; window.addProject = addProject;
    window.addBrand = addBrand; window.deleteService = deleteService; window.deleteProject = deleteProject;
    window.deleteBrand = deleteBrand; window.exportData = exportData; window.importData = importData;
    window.resetAll = resetAll; window.publishToWebsite = publishToWebsite;
</script>
</body>
</html>
