<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progetto Unico Group · CMS Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #0f0f1a; color: #fff; }
        
        .login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a472a 0%, #2d5a3b 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
        }
        .login-card {
            background: white;
            padding: 2.5rem;
            border-radius: 20px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            color: #333;
        }
        .login-card i { font-size: 3rem; color: #c17b4c; margin-bottom: 1rem; }
        .login-card input {
            width: 100%;
            padding: 1rem;
            margin: 0.5rem 0;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
        }
        .login-card button {
            width: 100%;
            padding: 1rem;
            background: #c17b4c;
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
        }
        
        .admin-container { display: none; }
        .admin-sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 280px;
            height: 100vh;
            background: #1a1a2e;
            overflow-y: auto;
        }
        .admin-logo {
            padding: 1.5rem;
            text-align: center;
            border-bottom: 1px solid #2c3e50;
        }
        .admin-logo h2 { color: #c17b4c; }
        .admin-menu { padding: 1rem 0; }
        .menu-item {
            padding: 1rem 1.5rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            cursor: pointer;
            transition: 0.3s;
            color: #aaa;
        }
        .menu-item:hover, .menu-item.active {
            background: #c17b4c;
            color: white;
        }
        .menu-item i { width: 25px; }
        
        .admin-content {
            margin-left: 280px;
            padding: 2rem;
        }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid #2c3e50;
        }
        .publish-btn, .view-site-btn, .logout-btn {
            padding: 0.5rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            border: none;
            font-weight: 600;
            margin-right: 1rem;
        }
        .publish-btn { background: #27ae60; color: white; }
        .view-site-btn { background: #2c3e50; color: white; text-decoration: none; display: inline-block; }
        .logout-btn { background: #e94560; color: white; }
        
        .section-editor {
            background: #1a1a2e;
            border-radius: 15px;
            padding: 2rem;
            margin-bottom: 2rem;
        }
        .section-title {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            color: #c17b4c;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #aaa;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid #2c3e50;
            border-radius: 8px;
            background: #0f3460;
            color: white;
        }
        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }
        .item-card {
            background: #0f3460;
            border-radius: 10px;
            padding: 1rem;
        }
        .btn-primary { background: #c17b4c; color: white; border: none; padding: 0.5rem 1rem; border-radius: 5px; cursor: pointer; }
        .btn-danger { background: #e94560; color: white; border: none; padding: 0.5rem 1rem; border-radius: 5px; cursor: pointer; }
        .btn-secondary { background: #2c3e50; color: white; border: none; padding: 0.5rem 1rem; border-radius: 5px; cursor: pointer; }
        
        .toast-msg {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #27ae60;
            padding: 1rem 2rem;
            border-radius: 10px;
            z-index: 2000;
            display: none;
        }
    </style>
</head>
<body>

<div id="loginOverlay" class="login-overlay">
    <div class="login-card">
        <i class="fas fa-crown"></i>
        <h2>Progetto Unico Group CMS</h2>
        <input type="text" id="adminUser" placeholder="Username" value="admin">
        <input type="password" id="adminPass" placeholder="Password" value="admin123">
        <button onclick="attemptLogin()">Login</button>
        <div id="loginError" style="color: red; margin-top: 1rem;"></div>
    </div>
</div>

<div id="adminContainer" class="admin-container">
    <div class="admin-sidebar">
        <div class="admin-logo">
            <h2><i class="fas fa-building"></i> Progetto Unico</h2>
        </div>
        <div class="admin-menu">
            <div class="menu-item active" data-section="hero"><i class="fas fa-home"></i> Hero</div>
            <div class="menu-item" data-section="about"><i class="fas fa-info-circle"></i> Group Story</div>
            <div class="menu-item" data-section="companies"><i class="fas fa-building"></i> Group Companies</div>
            <div class="menu-item" data-section="services"><i class="fas fa-concierge-bell"></i> Services</div>
            <div class="menu-item" data-section="projects"><i class="fas fa-hard-hat"></i> Projects</div>
            <div class="menu-item" data-section="brands"><i class="fas fa-trademark"></i> Brands</div>
            <div class="menu-item" data-section="contact"><i class="fas fa-address-card"></i> Contact</div>
            <div class="menu-item" data-section="footer"><i class="fas fa-copyright"></i> Footer</div>
            <div class="menu-item" data-section="design"><i class="fas fa-palette"></i> Design</div>
            <div class="menu-item" data-section="backup"><i class="fas fa-database"></i> Backup</div>
        </div>
    </div>
    
    <div class="admin-content">
        <div class="admin-header">
            <h1 id="currentSection">Hero Section</h1>
            <div>
                <button class="publish-btn" onclick="publishToWebsite()"><i class="fas fa-globe"></i> Publish</button>
                <a href="index.html" target="_blank" class="view-site-btn"><i class="fas fa-external-link-alt"></i> View Site</a>
                <button class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </div>
        </div>
        
        <div id="heroSection" class="section-editor">
            <h2 class="section-title">Hero Section</h2>
            <div class="form-group"><label>Main Title</label><input type="text" id="heroTitle"></div>
            <div class="form-group"><label>Subtitle</label><input type="text" id="heroSubtitle"></div>
            <div class="form-group"><label>Button Text</label><input type="text" id="heroBtnText"></div>
            <div class="form-group"><label>Background Image</label><input type="text" id="heroBgImage"></div>
            <button class="btn-primary" onclick="saveHero()">Save</button>
        </div>
        
        <div id="aboutSection" class="section-editor" style="display:none;">
            <h2 class="section-title">Group Story</h2>
            <div class="form-group"><label>Section Title</label><input type="text" id="aboutTitle"></div>
            <div class="form-group"><label>Story Text</label><textarea id="aboutText" rows="8"></textarea></div>
            <div class="form-group"><label>Mission Text</label><textarea id="missionText" rows="4"></textarea></div>
            <button class="btn-primary" onclick="saveAbout()">Save</button>
        </div>
        
        <div id="companiesSection" class="section-editor" style="display:none;">
            <h2 class="section-title">Group Companies</h2>
            <div id="companiesList"></div>
            <button class="btn-secondary" onclick="addCompany()">+ Add Company</button>
            <button class="btn-primary" onclick="saveCompanies()" style="margin-top:1rem;">Save Companies</button>
        </div>
        
        <div id="servicesSection" class="section-editor" style="display:none;">
            <h2 class="section-title">Services</h2>
            <div class="form-group"><label>Section Title</label><input type="text" id="servicesTitle"></div>
            <div id="servicesList"></div>
            <button class="btn-secondary" onclick="addService()">+ Add Service</button>
            <button class="btn-primary" onclick="saveServices()" style="margin-top:1rem;">Save Services</button>
        </div>
        
        <div id="projectsSection" class="section-editor" style="display:none;">
            <h2 class="section-title">Projects</h2>
            <div class="form-group"><label>Section Title</label><input type="text" id="projectsTitle"></div>
            <div id="projectsList"></div>
            <button class="btn-secondary" onclick="addProject()">+ Add Project</button>
            <button class="btn-primary" onclick="saveProjects()" style="margin-top:1rem;">Save Projects</button>
        </div>
        
        <div id="brandsSection" class="section-editor" style="display:none;">
            <h2 class="section-title">Partner Brands</h2>
            <div class="form-group"><label>Section Title</label><input type="text" id="brandsTitle"></div>
            <div id="brandsList"></div>
            <button class="btn-secondary" onclick="addBrand()">+ Add Brand</button>
            <button class="btn-primary" onclick="saveBrands()" style="margin-top:1rem;">Save Brands</button>
        </div>
        
        <div id="contactSection" class="section-editor" style="display:none;">
            <h2 class="section-title">Contact</h2>
            <div class="form-group"><label>Address</label><input type="text" id="contactAddress"></div>
            <div class="form-group"><label>Phone</label><input type="text" id="contactPhone"></div>
            <div class="form-group"><label>Email</label><input type="email" id="contactEmail"></div>
            <div class="form-group"><label>Facebook</label><input type="text" id="socialFacebook"></div>
            <div class="form-group"><label>Instagram</label><input type="text" id="socialInstagram"></div>
            <button class="btn-primary" onclick="saveContact()">Save</button>
        </div>
        
        <div id="footerSection" class="section-editor" style="display:none;">
            <h2 class="section-title">Footer</h2>
            <div class="form-group"><label>Footer Text</label><textarea id="footerText" rows="3"></textarea></div>
            <div class="form-group"><label>Copyright</label><input type="text" id="copyrightText"></div>
            <button class="btn-primary" onclick="saveFooter()">Save</button>
        </div>
        
        <div id="designSection" class="section-editor" style="display:none;">
            <h2 class="section-title">Design</h2>
            <div class="form-group"><label>Primary Color</label><input type="color" id="primaryColor"></div>
            <div class="form-group"><label>Secondary Color</label><input type="color" id="secondaryColor"></div>
            <button class="btn-primary" onclick="saveDesign()">Save</button>
        </div>
        
        <div id="backupSection" class="section-editor" style="display:none;">
            <h2 class="section-title">Backup</h2>
            <button class="btn-primary" onclick="exportData()">Download Backup</button>
            <input type="file" id="importFile" accept=".json" style="margin:1rem 0">
            <button class="btn-secondary" onclick="importData()">Restore Backup</button>
            <button class="btn-danger" onclick="resetAll()" style="margin-top:1rem;">Reset All</button>
        </div>
    </div>
</div>

<div id="toastMsg" class="toast-msg"></div>

<script>
    let websiteData = {
        hero: { title: "Progetto Unico Group", subtitle: "Galleria delle Idee · Ideal Casa Srl · EdilCost", btnText: "Scopri di Più", bgImage: "https://images.unsplash.com/photo-1600607687644-c7171b42498b?w=1600" },
        about: { title: "La Nostra Storia", text: "Progetto Unico Group nasce dalla fusione di tre eccellenze nel settore dell'edilizia e del design d'interni. Con oltre 30 anni di esperienza, offriamo soluzioni complete per la realizzazione della tua casa dei sogni.", mission: "La nostra missione è trasformare ogni spazio in un'opera d'arte, unendo tradizione, innovazione e design italiano d'eccellenza." },
        companies: [
            { name: "Galleria delle Idee", role: "Design & Showroom", icon: "fas fa-palette", desc: "Il cuore creativo del gruppo, dove le idee prendono forma attraverso design innovativi e soluzioni d'arredo uniche.", color: "#c17b4c" },
            { name: "Ideal Casa Srl", role: "Realizzazioni & Costruzioni", icon: "fas fa-home", desc: "Specializzata nella realizzazione di progetti residenziali e commerciali con standard qualitativi eccellenti.", color: "#667eea" },
            { name: "EdilCost", role: "Edilizia & Ristrutturazioni", icon: "fas fa-hard-hat", desc: "Esperienza e competenza nel settore edile, garantendo solidità e durata nel tempo.", color: "#27ae60" }
        ],
        services: { title: "I Nostri Servizi", items: [
            { icon: "fas fa-pen-ruler", title: "Progettazione", desc: "Design personalizzato su misura" },
            { icon: "fas fa-palette", title: "Interior Design", desc: "Arredamento e stile" },
            { icon: "fas fa-hard-hat", title: "Ristrutturazioni", desc: "Lavori edili completi" }
        ]},
        projects: { title: "Progetti Realizzati", items: [
            { title: "Villa di Lusso", desc: "Progetto completo di design e realizzazione", image: "https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=400" }
        ]},
        brands: { title: "Brand Partner", items: [
            { name: "Italian Design", logo: "fas fa-gem" }
        ]},
        contact: { address: "Via Francesco Rodio, 4 – 72017 - Ostuni (BR)", phone: "+39.0831 341520", email: "info@galleriadelleidee.com", social: { facebook: "#", instagram: "#" } },
        footer: { text: "Progetto Unico Group · Galleria delle Idee · Ideal Casa Srl · EdilCost", copyright: "© 2025 Tutti i diritti riservati" },
        design: { primaryColor: "#c17b4c", secondaryColor: "#667eea" }
    };
    
    function showToast(msg) {
        const toast = document.getElementById('toastMsg');
        toast.textContent = msg;
        toast.style.display = 'block';
        setTimeout(() => toast.style.display = 'none', 2000);
    }
    
    function loadData() {
        const saved = localStorage.getItem('progettoCMS_v3');
        if(saved) websiteData = JSON.parse(saved);
        populateFields();
        renderCompaniesList();
        renderServicesList();
        renderProjectsList();
        renderBrandsList();
    }
    
    function saveData() {
        localStorage.setItem('progettoCMS_v3', JSON.stringify(websiteData));
        showToast("Saved!");
    }
    
    function publishToWebsite() {
        saveHero(); saveAbout(); saveCompanies(); saveServices(); saveProjects(); saveBrands(); saveContact(); saveFooter(); saveDesign();
        showToast("✅ Published!");
        setTimeout(() => window.open('index.html', '_blank'), 500);
    }
    
    function populateFields() {
        document.getElementById('heroTitle').value = websiteData.hero.title;
        document.getElementById('heroSubtitle').value = websiteData.hero.subtitle;
        document.getElementById('heroBtnText').value = websiteData.hero.btnText;
        document.getElementById('heroBgImage').value = websiteData.hero.bgImage;
        document.getElementById('aboutTitle').value = websiteData.about.title;
        document.getElementById('aboutText').value = websiteData.about.text;
        document.getElementById('missionText').value = websiteData.about.mission;
        document.getElementById('servicesTitle').value = websiteData.services.title;
        document.getElementById('projectsTitle').value = websiteData.projects.title;
        document.getElementById('brandsTitle').value = websiteData.brands.title;
        document.getElementById('contactAddress').value = websiteData.contact.address;
        document.getElementById('contactPhone').value = websiteData.contact.phone;
        document.getElementById('contactEmail').value = websiteData.contact.email;
        document.getElementById('socialFacebook').value = websiteData.contact.social.facebook;
        document.getElementById('socialInstagram').value = websiteData.contact.social.instagram;
        document.getElementById('footerText').value = websiteData.footer.text;
        document.getElementById('copyrightText').value = websiteData.footer.copyright;
        document.getElementById('primaryColor').value = websiteData.design.primaryColor;
        document.getElementById('secondaryColor').value = websiteData.design.secondaryColor;
    }
    
    function saveHero() {
        websiteData.hero.title = document.getElementById('heroTitle').value;
        websiteData.hero.subtitle = document.getElementById('heroSubtitle').value;
        websiteData.hero.btnText = document.getElementById('heroBtnText').value;
        websiteData.hero.bgImage = document.getElementById('heroBgImage').value;
        saveData();
    }
    
    function saveAbout() {
        websiteData.about.title = document.getElementById('aboutTitle').value;
        websiteData.about.text = document.getElementById('aboutText').value;
        websiteData.about.mission = document.getElementById('missionText').value;
        saveData();
    }
    
    function renderCompaniesList() {
        const container = document.getElementById('companiesList');
        if(!container) return;
        container.innerHTML = '<div class="items-grid" id="companiesGrid"></div>';
        const grid = document.getElementById('companiesGrid');
        websiteData.companies.forEach((c, i) => {
            grid.innerHTML += `<div class="item-card">
                <i class="${c.icon}" style="font-size:2rem; color:#c17b4c"></i>
                <input type="text" id="comp_name_${i}" value="${c.name}" style="width:100%; margin:10px 0">
                <input type="text" id="comp_role_${i}" value="${c.role}" style="width:100%; margin:10px 0">
                <textarea id="comp_desc_${i}" style="width:100%">${c.desc}</textarea>
                <button class="btn-danger" onclick="deleteCompany(${i})">Delete</button>
            </div>`;
        });
    }
    
    function saveCompanies() {
        const newCompanies = [];
        for(let i = 0; i < websiteData.companies.length; i++) {
            let name = document.getElementById(`comp_name_${i}`)?.value;
            if(name) newCompanies.push({
                name, role: document.getElementById(`comp_role_${i}`)?.value,
                icon: websiteData.companies[i].icon, desc: document.getElementById(`comp_desc_${i}`)?.value
            });
        }
        websiteData.companies = newCompanies;
        saveData();
        renderCompaniesList();
    }
    
    function addCompany() {
        websiteData.companies.push({ name: "New Company", role: "Role", icon: "fas fa-building", desc: "Description" });
        renderCompaniesList();
    }
    
    function deleteCompany(i) { websiteData.companies.splice(i,1); renderCompaniesList(); }
    function renderServicesList() { /* Similar implementation */ }
    function saveServices() { /* Similar */ }
    function addService() { websiteData.services.items.push({ icon: "fas fa-star", title: "New", desc: "" }); renderServicesList(); }
    function renderProjectsList() { /* Similar */ }
    function saveProjects() { /* Similar */ }
    function addProject() { websiteData.projects.items.push({ title: "New", desc: "", image: "" }); renderProjectsList(); }
    function renderBrandsList() { /* Similar */ }
    function saveBrands() { /* Similar */ }
    function addBrand() { websiteData.brands.items.push({ name: "New Brand", logo: "fas fa-star" }); renderBrandsList(); }
    function saveContact() { /* Similar */ }
    function saveFooter() { /* Similar */ }
    function saveDesign() { /* Similar */ }
    function exportData() { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(websiteData)])); a.download = 'backup.json'; a.click(); }
    function importData() { const file = document.getElementById('importFile').files[0]; if(file) { const r = new FileReader(); r.onload = e => { websiteData = JSON.parse(e.target.result); saveData(); location.reload(); }; r.readAsText(file); } }
    function resetAll() { if(confirm('Reset all?')) { localStorage.removeItem('progettoCMS_v3'); location.reload(); } }
    
    document.querySelectorAll('.menu-item').forEach(item => {
        item.addEventListener('click', function() {
            const section = this.dataset.section;
            document.querySelectorAll('.section-editor').forEach(el => el.style.display = 'none');
            document.getElementById(`${section}Section`).style.display = 'block';
            document.querySelectorAll('.menu-item').forEach(el => el.classList.remove('active'));
            this.classList.add('active');
            document.getElementById('currentSection').innerHTML = this.textContent.trim();
        });
    });
    
    function attemptLogin() {
        if(document.getElementById('adminUser').value === 'admin' && document.getElementById('adminPass').value === 'admin123') {
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('adminContainer').style.display = 'block';
            loadData();
        } else document.getElementById('loginError').innerText = 'Wrong credentials!';
    }
    function logout() { document.getElementById('loginOverlay').style.display = 'flex'; document.getElementById('adminContainer').style.display = 'none'; }
    
    window.attemptLogin = attemptLogin; window.logout = logout; window.saveHero = saveHero; window.saveAbout = saveAbout;
    window.saveCompanies = saveCompanies; window.saveServices = saveServices; window.saveProjects = saveProjects;
    window.saveBrands = saveBrands; window.saveContact = saveContact; window.saveFooter = saveFooter; window.saveDesign = saveDesign;
    window.addCompany = addCompany; window.addService = addService; window.addProject = addProject; window.addBrand = addBrand;
    window.deleteCompany = deleteCompany; window.exportData = exportData; window.importData = importData; window.resetAll = resetAll;
    window.publishToWebsite = publishToWebsite;
</script>
</body>
</html>
